[project]
name = "voice-agent2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sai Sandeep Choudary", email = "your_email@example.com" }
]
requires-python = ">=3.10,<3.13"
dependencies = [
    "espeakng-loader>=0.2.4",
    "google-genai>=2.18.0",
    "kokoro>=0.9.4",
    "kokoro-onnx>=0.5.0",
    "numpy>=2.2.6",
    "openai>=3.0.0",
    "openai-whisper>=20250625",
    "python-dotenv>=1.2.2",
    "scipy>=1.15.3",
    "silero-vad>=6.2.1",
    "sounddevice>=0.5.5",
    "soundfile>=0.14.0",
    "torchaudio>=2.11.0",
]

[project.scripts]
voice-agent2 = "voice_agent2:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
